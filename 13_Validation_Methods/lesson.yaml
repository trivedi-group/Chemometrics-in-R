- Class: text
  Output: You have been mastering your R skills in the recent weeks! This week we will learn two important things - validation methods and plotting systems in R.

- Class: text
  Output: A note before you begin. When you finish this lesson and send your reflection, the commands from the lesson will be saved as an R script in your working folder. You can run that script again later or use it as a starting point for your own analyses.

- Class: text
  Output: When you restart swirl, type your name exactly as you did before, including capital letters, so that you can carry on where you left off.

- Class: text
  Output: This exercise is for validation methods. We will learn about CV and bootstrapping - the concepts we've discussed in videos. 

- Class: text
  Output: For our R exercise, we want to see how you can do this in R. I would recommend practising writing codes as more you write, better you'll get. 

- Class: text
  Output: Let's start with cross validation. Cross-validation is also known as a resampling method because it involves fitting the same statistical method multiple times using different subsets of the data.

- Class: cmd_question
  Output: I've loaded two packages you need for this exercise - tidyverse and caret. But for practice, use library() command to load tidyverse.
  CorrectAnswer: library(tidyverse)
  AnswerTests: omnitest(correctExpr='library(tidyverse)')
  Hint: library(tidyverse)

- Class: cmd_question
  Output: Now load caret.
  CorrectAnswer: library(caret)
  AnswerTests: omnitest(correctExpr='library(caret)')
  Hint: library(caret)

- Class: cmd_question
  Output: Let's load our 'swiss' data. Use data() to do this.
  CorrectAnswer: data("swiss")
  AnswerTests: omnitest(correctExpr='data("swiss")')
  Hint: Type data("swiss") and hit Enter.

- Class: text
  Output: Normally, once we build a model, what we are interested in is determining the accuracy of this model on predicting the outcome for new unseen observations not used to build the model.

- Class: text
  Output: R-squared, RMSE and MAE are used to measure the regression model performance during cross-validation.

- Class: text
  Output: Let's look at validation set approach. We will split our swiss data into two sets. 80% of the data will be used for training and the remaining 20% we will use for test data.

- Class: text
  Output: To achieve this we will use createDataPartition() command from the caret package. Tidyverse also uses '%>%' pipe operator. We will use that to pass our original swiss data to createDataPartition.

- Class: text
  Output: createDataPartition() uses an argument 'p' which shows portion of partition that should be allocated to training data. We want 80% which is written as 0.8.

- Class: cmd_question
  Output: Pass swiss$Fertility variable using pipe operator to createDataPartition() where p is equal to 0.8. Save the output as 'training.samples'
  CorrectAnswer: training.samples <- swiss$Fertility %>% createDataPartition(p=0.8)
  AnswerTests: omnitest(correctExpr='training.samples <- swiss$Fertility %>% createDataPartition(p=0.8)')
  Hint: Type training.samples <- swiss$Fertility %>% createDataPartition(p=0.8) and hit Enter.

- Class: cmd_question
  Output: Now use the same command as before but add an argument list=FALSE, along with p=0.8 in createDataPartition function. We do this because by default createDataPartition creates a list. We do not want this as list going further. We want to use the output so we use list=FALSE argument. Give it a go..
  CorrectAnswer: training.samples <- swiss$Fertility %>% createDataPartition(p=0.8, list=FALSE)
  AnswerTests: omnitest(correctExpr='training.samples <- swiss$Fertility %>% createDataPartition(p=0.8, list=FALSE)')
  Hint: Type training.samples <- swiss$Fertility %>% createDataPartition(p=0.8, list=FALSE) and hit Enter.

- Class: text
  Output: Now our train data will be all the samples included in 0.8 partition we just created and our test data will be remaining 0.2 samples. 

- Class: cmd_question
  Output: To achieve this, let us save train data in a variable called train.data. We use subset i.e. square brackets to show subset of our original swiss data. This can be written as 'swiss[training.samples,]'. By writing this what we are telling R is that all the rows that are present in training.samples should be subset from original data and saved as 'train.data'. Give it a go..
  CorrectAnswer: train.data <- swiss[training.samples,]
  AnswerTests: omnitest(correctExpr='train.data <- swiss[training.samples,]')
  Hint: Type train.data <- swiss[training.samples,] and hit Enter.

- Class: text
  Output: Now all we need to tell R is the rows that are not in training.samples are the rows that should be saved to a different data called test.data. Can you guess how we do it?

- Class: cmd_question
  Output: It is simple, we use identical expression we had on our right hand side, but we add minus sign in front of training.samples, like this.. 'swiss[-training.samples,]'. Save this as test.data now..
  CorrectAnswer: test.data <- swiss[-training.samples,]
  AnswerTests: omnitest(correctExpr='test.data <- swiss[-training.samples,]')
  Hint: Type test.data <- swiss[-training.samples,] and hit Enter.

- Class: text
  Output: There you go! Now you have your swiss data randomly split into two sets - train.data and test.data. From this point you can use train data for any model you want to train and test data to make prediction from a fitted model. This is validation set approach we talked about in our videos this week. 

- Class: text
  Output: Now, let's see how we can use these data for linear regression using lm() function we discussed earlier. 

- Class: text
  Output: You probably remember when we used lm() function, it required a formula that had 'response~predictor' format and second argument was data. We will use train.data to build our model.

- Class: cmd_question
  Output: Our formula will be 'Fertility~.' which indicates we want to perform regression of response variable Fertility against all other variables. But we also need second argument, which will be train.data. Now perform lm() with these two arguments and save the output to 'model'.
  CorrectAnswer: model <- lm(Fertility~., data=train.data)
  AnswerTests: omnitest(correctExpr='model <- lm(Fertility~., data=train.data)')
  Hint: model <- lm(Fertility~., data=train.data)

- Class: cmd_question
  Output: We will now perform prediction on test.data using our fitted 'model'. We will use pipe to pass on our model to predict() function that will use test.data as its argument. Save the output as 'predictions'..
  CorrectAnswer: predictions <- model %>% predict(test.data)
  AnswerTests: omnitest(correctExpr='predictions <- model %>% predict(test.data)')
  Hint: predictions <- model %>% predict(test.data)

- Class: text
  Output: When comparing two models, the one that produces the lowest test sample RMSE is the preferred model.

- Class: text
  Output: Now let's look at leave one out cross validation. 

- Class: text
  Output: For this method, the advantage is we will use all data points and won't need to split our data into two sets.

- Class: cmd_question
  Output: Let's create training data. We will call this 'train.loocv'. We will use command trainControl() from caret package. The only argument we need to pass on is what method we want to use. Here it will be 'LOOCV' - case sensitive. Give it a go..
  CorrectAnswer: train.loocv <- trainControl("LOOCV")
  AnswerTests: omnitest(correctExpr='train.loocv <- trainControl("LOOCV")')
  Hint: Type train.loocv <- trainControl("LOOCV") and hit Enter.

- Class: text
  Output: With caret package lm() is a little different. Instead of using lm() function we use train() function that has options to perform many different classification and regression tasks. We select what we want to perform under method argument. So for us method = "lm"

- Class: text
  Output: Like lm() we will have to provide a formula which will be Fertility against all other variables i.e. 'Fertility~.' and also data will be equal to swiss.

- Class: text
  Output: In addition to these three arguments, one key argument that will make leave one out cross validation possible is trControl. This define what will be training set. For us it will be 'trControl=train.loocv' that we just created. 

- Class: cmd_question
  Output: Can you save the model as 'loocvmodel' and use command train(), where your formula is 'Fertility~.', data is swiss, method is lm, trControl is train.loocv?
  CorrectAnswer: loocvmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.loocv)
  AnswerTests: omnitest(correctExpr='loocvmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.loocv)')
  Hint: It is a little longer task to write. Type loocvmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.loocv) and hit Enter.

- Class: cmd_question
  Output: To see how our leave one out model fits, you can use print() command and write loocvmodel as argument to see how the model looks.
  CorrectAnswer: print(loocvmodel)
  AnswerTests: omnitest(correctExpr='print(loocvmodel)')
  Hint: Type print(loocvmodel) and hit Enter.

- Class: text
  Output: The advantage of the LOOCV method is that we make use all data points reducing potential bias. However, the process is repeated as many times as there are data points, resulting to a higher execution time when n is extremely large.

- Class: text
  Output: Let's look at k-fold cross validation now.
  
- Class: text
  Output: The most obvious advantage of k-fold CV compared to LOOCV is computational. A less obvious but potentially more important advantage of k-fold CV is that it often gives more accurate estimates of the test error rate than does LOOCV.

- Class: text
  Output: Lower value of K is more biased and hence undesirable. On the other hand, higher value of K is less biased, but can suffer from large variability.

- Class: text
  Output: Do you remember what we did for LOOCV? We will do the exact same thing. But this time with slightly different parameters.

- Class: text
  Output: When we make our training data, we will call it train.kfold. We will again use trainControl() command from caret package.

- Class: text
  Output: This time for trainControl() command we will use method="cv" and number=10. These parameter suggests R that we want to do cross validation with 10 folds. If you wanted 5 folds, you would change number to 5.  

- Class: text
  Output: Then the way we create our kfoldmodel will be same, using train() command. 

- Class: cmd_question
  Output: So let's define our training data. We want to call it train.kfold. To create train.kfold, we will use trainControl() function with arguments, 'method="cv"' and 'number=10'. See if you can write this bit of code..
  CorrectAnswer: train.kfold <- trainControl(method="cv", number=10)
  AnswerTests: omnitest(correctExpr='train.kfold <- trainControl(method="cv", number=10)')
  Hint: Type train.kfold <- trainControl(method="cv", number=10) and hit Enter.

- Class: text
  Output: If you wanted to performed repeated k-fold cross validation where you repeat the process of splitting the data into k-folds, at this stage, you change the method to 'repeatedcv' instead of just 'cv' and specify an additional argument 'repeats=x' where x can be the number of times you want to repeat the process.

- Class: text
  Output: For the purpose of simplicity, we will not do repeated k-fold but you could use the same data in your workspace, after you've completed the course, to see if your model is any different using repeated k-fold.

- Class: cmd_question
  Output: Now that we've created our train.kfold, we will model our data such that our training set is made with train.kfold. We will use train() function for this. Our arguments will remain the same like we did for cross validation. We want our formula to be 'Fertility~.', data to be swiss, method to be lm and trControl to be train.kfold. Don't forget to save the model as kfoldmodel Give it a go! 
  CorrectAnswer: kfoldmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.kfold)
  AnswerTests: omnitest(correctExpr='kfoldmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.kfold)')
  Hint: Type kfoldmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.kfold) and hit Enter.

- Class: cmd_question
  Output: Same as last time, to view the model, use print() command. 
  CorrectAnswer: print(kfoldmodel)
  AnswerTests: omnitest(correctExpr='print(kfoldmodel)')
  Hint: Type print(kfoldmodel) and hit Enter. 

- Class: text
  Output: So far, we've discussed, validation set approach, leave-one-out cross-validation, k-fold cross-validation and repeated k-fold cross-validation. 

- Class: text
  Output: Another alternative to cross-validation is the bootstrap resampling methods, which consists of repeatedly and randomly selecting a sample of n observations from the original data set, and to evaluate the model performance on each copy.

- Class: text
  Output: Let us look at bootstrapping now. We will use the same packages - caret and tidyverse for this.

- Class: text
  Output: Nothing changes in terms of our workflow. We will use the same trainControl() function to define how we build our training set.

- Class: text
  Output: For bootstrapping, we use 'method="boot"' and then specify how many resampling do we want to do by replacing x in 'number=x'.

- Class: text
  Output: Let us see how we will do that. 

- Class: cmd_question
  Output: This time call your training data, train.boot. Use boot for your method and resample for 100 times. Give it a go..
  CorrectAnswer: train.boot <- trainControl(method="boot", number=100)
  AnswerTests: omnitest(correctExpr='train.boot <- trainControl(method="boot", number=100)')
  Hint: Type train.boot <- trainControl(method="boot", number=100) and hit Enter.

- Class: cmd_question
  Output: Now let's use train() function like we did for cross validation methods. Your formula is the same 'Fertility~.', data is swiss, method is lm, trControl is train.boot. Save the output to bootmodel.
  CorrectAnswer: bootmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.boot)
  AnswerTests: omnitest(correctExpr='bootmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.boot)')
  Hint: Type bootmodel <- train(Fertility~., data=swiss, method="lm", trControl=train.boot) and hit Enter.

- Class: mult_question
  Output: What command will you type to get the summary of our bootmodel in console?
  AnswerChoices: print(model); model(); bootmodel(); print(bootmodel)
  CorrectAnswer: print(bootmodel)
  AnswerTests: omnitest(correctVal='print(bootmodel)')
  Hint: print() command with argument bootmodel in it.

- Class: cmd_question
  Output: Go on use print() for see our model in console.
  CorrectAnswer: print(bootmodel)
  AnswerTests: omnitest(correctExpr='print(bootmodel)')
  Hint: print(bootmodel)

- Class: text
  Output: The output shows the average model performance across the 100 resamples.

- Class: text
  Output: RMSE (Root Mean Squared Error) and MAE(Mean Absolute Error), represent two different measures of the model prediction error. The lower the RMSE and the MAE, the better the model.

- Class: text
  Output: The R-squared represents the proportion of variation in the outcome explained by the predictor variables included in the model. The higher the R-squared, the better the model.

- Class: text
  Output: That's all for your validation methods in R. It is so easy to create validated models that it would be a crime not to validate your models! 

