- Class: meta
  Course: Chemometrics DL
  Lesson: Data Visualisation
  Author: Drupad Trivedi
  Type: Standard
  Organization: University of Manchester
  Version: 2.4.5

- Class: text
  Output: Welcome to this lesson! So far, we have looked at a few statistical tests. Data analysis you perform using those tests is called univariate analysis. 

- Class: text
  Output: A note before you begin. When you finish this lesson and send your reflection, the commands from the lesson will be saved as an R script in your working folder. You can run that script again later or use it as a starting point for your own analyses.

- Class: text
  Output: When you restart swirl, type your name exactly as you did before, including capital letters, so that you can carry on where you left off.

- Class: text
  Output: A good chemometrician will always visualise their data first before starting with statistical analysis. Why? Because it gives a good summary of your data. 


- Class: text
  Output: We learnt in the previous week that knowing your data structure is very important. From this week on, we will use R more often to get hands on experience with exploring data structure and also for data analysis.

- Class: text
  Output: Now that you are comfortable with using R and Swirl, let us learn a few basic commands. I have included a mass spectrometry data for you in this lesson.


- Class: cmd_question
  Output: Let us try to view this data. Type 'View(data)' followed by Enter and see what happens.
  CorrectAnswer: View(data)
  AnswerTests: omnitest(correctExpr='View(data)')
  Hint: Type View(data) and hit Enter.
  
- Class: text
  Output: The data contains 181 samples. Each sample has one group label, in the first column, followed by 5897 continuous variables.

- Class: mult_question
  Output: The group column is..
  AnswerChoices: Quantitative variable; An ordinal variable; A continuous variable; A nominal variable
  CorrectAnswer: A nominal variable
  AnswerTests: omnitest(correctVal='A nominal variable')
  Hint: The group column has labels such as QC, Case and Control. 
  
- Class: text
  Output: This data has LOTS of variables measured in serum samples. These measurements will have many underlying variations and not all of these can be accounted for using univariate statistics.

- Class: cmd_question
  Output: You can view single variable in a big dataset using '$'. For example to view first continuous variable M304T13, you can use command 'View(data$M304T13)'. Try typing this now. 
  CorrectAnswer: View(data$M304T13)
  AnswerTests: omnitest(correctExpr='View(data$M304T13)')
  Hint: Type View(data$M304T13) and hit Enter.
  
- Class: text
  Output: Dot plots are simplest graphs to view any variable. Mostly the data is plotted across x-axis. Hit Enter to view dot plot for this variable M304T13

- Class: figure
  Output: You are now viewing our variable as a dot plot. 
  Figure: dotplot.R
  FigureType: new
  
- Class: text
  Output: We can see from this dot plot that most of our samples have a low intensity for this variable, while some samples have very high intensities.

- Class: text
  Output: Dot plots are very effective in displaying individual variables by samples. They are useful in small dataset. But can you imagine doing this plot for each variable, when you have thousands of variables?

- Class: text
  Output: You have come across histograms earlier. These are sort of dot plots, but instead of individual numerical value, we visualise 'data bins' where data is partitioned to represent our data in a condensed form. Hit Enter to view M304T13 as a histogram.

- Class: figure
  Output: M304T13 histogram is now displayed as a figure. 
  Figure: histogram.R
  FigureType: new
  
- Class: text
  Output: Similar to our dot plot, even as a histogram, we can see the majority of our samples have a low intensity for this variable. But you can also see some samples have really high intensity (to the extreme right of the histogram).

- Class: text
  Output: Histograms are great to visualise the shape of distribution of our data. Data can be left or right skewed. Hit Enter to view an example of right skewed data.

- Class: figure
  Output: Here the distribution is skewed to the right. 
  Figure: mod1_rightskew.R
  FigureType: new
  
- Class: text
  Output: Similarly, some datasets can be left skewed where the left tail of the plot is longer. We decide skewness by looking at the tail. Hit Enter to see what I mean by left skewed data.

- Class: figure
  Output: Now this is a left skewed data example. Note that the blue line in both cases is MEAN and black line is MEDIAN.
  Figure: mod1_leftskew.R
  FigureType: new
  
- Class: text
  Output: 'Let us go back to our histogram.'

- Class: figure
  Output: M304T13 histogram is now displayed as a figure. 
  Figure: histogram.R
  FigureType: new
  
- Class: mult_question
  Output: What can you tell about the skewness of this variable?
  AnswerChoices: Left skewed; Symmetrical; Right skewed
  CorrectAnswer: Right skewed
  AnswerTests: omnitest(correctVal='Right skewed')
  Hint: The tail of our histogram is longer on the right. 

- Class: video
  Output: A special type of histogram is known as Stem and Leaf plot. The numerical data is organised in order of decimal place values. The number of leaves is equal to the number of observations in the dataset. Have a look at Stem and Leaf plot on YouTube.
  VideoLink: http://youtu.be/OaJXJduRiIE
  
- Class: text
  Output: That's all for quick visualisations in R. You've learned dot plots, histograms and stem and leaf plots. There are scripts for it too, which will be made available to you if you need them later in this unit.
  
- Class: text
