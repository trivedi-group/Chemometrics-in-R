- Class: text
  Output: Hello! Welcome to our interactive R exercise about Factors.

- Class: text
  Output: A note before you begin. When you finish this lesson and send your reflection, the commands from the lesson will be saved as an R script in your working folder, or in a local folder if yours is cloud-synced. You can run that script again later or use it as a starting point for your own analyses.

- Class: text
  Output: When you restart swirl, type your name exactly as you did before, including capital letters, so that you can carry on where you left off.

- Class: text
  Output: Factors are used to represent categorical data.

- Class: mult_question
  Output: Factors can be ordered or unordered. 
  AnswerChoices: TRUE;FALSE
  CorrectAnswer: TRUE
  AnswerTests: omnitest(correctVal='TRUE')
  Hint: Does it matter if you write male, female or female, male?

- Class: text
  Output: The factor() command is used to create and modify factors in R.
  
- Class: text
  Output: c() command is used to combine more than 1 value when assigning them to a variable. For example *c("one", "two")*

- Class: cmd_question
  Output: Can you use factor() to create factors called 'male' and 'female' and assign these to a variable named 'gender'?
  CorrectAnswer: gender <- factor(c("male", "female"))
  AnswerTests: omnitest(correctExpr='gender <- factor(c("male", "female"))')
  Hint: use factor() and gender <- factor(.....
  
 
- Class: cmd_question
  Output: Now can you repeat the same command as previous question, but this time create male, female, female and male - 4 values as factors.
  CorrectAnswer: gender <- factor(c("male", "female", "female", "male"))
  AnswerTests: omnitest(correctExpr='gender <- factor(c("male", "female", "female", "male"))')
  Hint: It is important to create the factors in this same order i.e. male, female, female and male.

- Class: text
  Output: R will assign 1 to level "female" and 2 to "male". We have covered in our video, why this happens. levels() command is used to check this.

- Class: cmd_question
  Output: Check levels in your variable 'gender'
  CorrectAnswer: levels(gender)
  AnswerTests: omnitest(correctExpr='levels(gender)')
  Hint: levels(gender)

- Class: text
  Output: Sometimes, the order of the factors does not matter, other times you might want to specify the order because it is meaningful (e.g., “low”, “medium”, “high”) or it is required by particular type of analysis.

- Class: text
  Output: Let's say you were measuring amount of caffeine in various commercial coffees and recording the range of values as 'high', 'medium' and 'low'. The auto-assignment of levels would not be what you need i.e. high, low, medium (alphabetic order).

- Class: text
  Output: In the following example, we will create a factor called coffee with high, medium and low values.

- Class: text
  Output: 'coffee <- factor(c("low", "high", "medium", "high", "low", "medium", "high"))'
  
- Class: cmd_question
  Output: Can you now replicate the above code to create a variable called coffee in your workspace?
  CorrectAnswer: coffee <- factor(c("low", "high", "medium", "high", "low", "medium", "high"))
  AnswerTests: omnitest(correctExpr='coffee <- factor(c("low", "high", "medium", "high", "low", "medium", "high"))')
  Hint: Copy coffee <- factor(c("low", "high", "medium", "high", "low", "medium", "high")) from previous question and paste in console. Hit enter.

- Class: text
  Output: Notice that we have made 7 measurements of coffee and assigned them high, low and medium values.

- Class: cmd_question
  Output: Use levels() command to display levels of variable coffee.
  CorrectAnswer: levels(coffee)
  AnswerTests: omnitest(correctExpr='levels(coffee)')
  Hint: levels(coffee)

- Class: text
  Output: Did you notice how R orders alphabetically high, low and medium? 

- Class: cmd_question
  Output: You can also view variable coffee by just typing coffee in the console. Let's do that.
  CorrectAnswer: coffee
  AnswerTests: omnitest(correctExpr='coffee')
  Hint: Type coffee and hit enter.

- Class: text
  Output: You can arrange the levels in an order by using the following command.

- Class: text
  Output: 'coffee <- factor(coffee, levels = c("low", "medium", "high"), ordered = TRUE)'


- Class: cmd_question
  Output: Keeping the above answer in mind, can you now try to order them high, medium and low? 
  CorrectAnswer: coffee <- factor(coffee, levels = c("high", "medium", "low"), ordered = TRUE)
  AnswerTests: omnitest(correctExpr='coffee <- factor(coffee, levels = c("high", "medium", "low"), ordered = TRUE)')
  Hint: coffee <- factor(coffee, levels = c("high", "medium", "low"), ordered = TRUE)
  
- Class: text
  Output: You've now learnt how to handle factors in R. This will come in handy when you learn data visualisation in R. Hit Enter to continue.

