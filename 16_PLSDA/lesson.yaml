- Class: meta
  Course: Chemometrics in R
  Lesson: Supervised_Learning
  Author: Drupad K Trivedi
  Type: Standard
  Organization: The University of Manchester
  Version: 2.4.5

- Class: text
  Output: Welcome to Swirl exercises on Supervised Learning. You should have gone through the tasks on Canvas this week that covers many tests we will learn in this exercise.

- Class: text
  Output: A note before you begin. When you finish this lesson and send your reflection, the commands from the lesson will be saved as an R script in your working folder, or in a local folder if yours is cloud-synced. You can run that script again later or use it as a starting point for your own analyses.

- Class: text
  Output: When you restart swirl, type your name exactly as you did before, including capital letters, so that you can carry on where you left off.

- Class: mult_question
  Output: PLS-DA is not a supervised learning method.
  AnswerChoices: TRUE;FALSE
  CorrectAnswer: FALSE
  AnswerTests: omnitest(correctVal='FALSE')
  Hint: Partial least squares discriminant analysis is a variation of partial least squares, a supervised learning method.

- Class: text
  Output: Before we start, please make sure you have installed the package called 'mixOmics' from Bioconductor. If not, please follow instructions on Canvas for this.

  
- Class: text
  Output: If your installation did not complete, I recommend stopping this exercise here and contact Drupad.

- Class: cmd_question
  Output: In R, once we install a package, we need to load it. In order to load 'mixOmics', the command to use is library("mixOmics"). Give it a go!
  CorrectAnswer: library("mixOmics")
  AnswerTests: any_of_exprs('library(mixOmics)', 'library("mixOmics")', "library('mixOmics')")
  Hint: Type library("mixOmics") and press Enter.

- Class: text
  Output: As much as using 'install.packages()', you will use 'library()' command. Any package not already loaded, cannot open functions or read them, unless you use library()

- Class: cmd_question
  Output: We need to load data into R before we can perform any analysis. There are several ways to do that but we will use data that is already loaded with our 'mixOmics' package. Use 'data("liver.toxicity")' to load the data.
  CorrectAnswer: data("liver.toxicity")
  AnswerTests: any_of_exprs('data("liver.toxicity")', 'data(liver.toxicity)', "data('liver.toxicity')")
  Hint: Type data("liver.toxicity") and press Enter.
  
- Class: text
  Output: Now you will see data loaded into the RStudio environment. We learnt about X variables and Y variable when talking about PLS-DA. Let's assign them from data.

- Class: text
  Output: But before that, do you remember what command we used to view the data? Try that command to see what data we have.

- Class: cmd_question
  Output: View liver.toxicity data.
  CorrectAnswer: View(liver.toxicity)
  AnswerTests: omnitest(correctExpr='View(liver.toxicity)')
  Hint: View(liver.toxicity)

- Class: text
  Output: Now let's create our X variables. In this dataset genes were measured. These will be our X-variables and our response variable Y will be the time at which each rat was examined after it was given paracetamol (six, 18, 24 or 48 hours).

- Class: text
  Output: In R we want to specify that our X is set of variables, a matrix. We can do this using 'as.matrix()' command. We can also tell R, that our response variable Y, is some sort of group i.e. factor. We use 'as.factor()' for this.

- Class: cmd_question
  Output: You can assign X, by using as.matrix() command. But we need to specify what object within our dataset is going to be inside that bracket. Remember use of '$' sign? Type out liver.toxicity$gene to see what happens.
  CorrectAnswer: liver.toxicity$gene
  AnswerTests: omnitest(correctExpr='liver.toxicity$gene')
  Hint: Type liver.toxicity$gene and press Enter.

- Class: cmd_question
  Output: Now let's assign, this as matrix to variable X. 
  CorrectAnswer: X <- as.matrix(liver.toxicity$gene)
  AnswerTests: omnitest(correctExpr='X <- as.matrix(liver.toxicity$gene)')
  Hint: Type X <- as.matrix(liver.toxicity$gene) and press Enter. By doing that, you are making sure that all the genes in our liver.toxicity data are assigned to X as a matrix.

- Class: text
  Output: There are lots of variables in this study. We will only use one of the many columns here. In R, 'data[1,2]' shows you are subsetting to first row and second column of data.
  
- Class: text
  Output: We want all rows of the treatment table but only one column. If you want to subset all rows, you leave row part empty, for example 'data[ ,2]' now tells R that we want all rows but only column 2.
  
- Class: text
  Output: The column we are interested in for this data, is column four, called Time.Group, which holds the time of examination after dosing. In the next step, consider this subset option when creating your factor. We want column number 4 and all rows.
  
- Class: cmd_question
  Output: Now let's assign, 'liver.toxicity$treatment' as factor to variable Y. It is fourth column within 'treatment'. 
  CorrectAnswer: Y <- as.factor(liver.toxicity$treatment[,4])
  AnswerTests: omnitest(correctExpr='Y <- as.factor(liver.toxicity$treatment[,4])')
  Hint: Type Y <- as.factor(liver.toxicity$treatment[,4]) and press Enter. By doing that, you are making sure the time group in our liver.toxicity data is assigned to Y as a factor.

- Class: text
  Output: Now that we know what our X and Y variables are, we can start thinking about performing PLS-DA. 

- Class: mult_question
  Output: Do you recollect from our video, what the first step will be before performing PLS-DA?
  AnswerChoices: Draw a graph; Find centroid; Calculate distances; Normalise data
  CorrectAnswer: Normalise data
  AnswerTests: omnitest(correctVal='Normalise data')
  Hint: Normalisation is the first step before we start with PLS analysis.
  
- Class: cmd_question
  Output: The function to perform plsda is 'plsda'. The way to write is 'plsda(X,Y, ncomp=5)'. Here we are going to use the first 5 components to understand the data. Try writing plsda command.
  CorrectAnswer: plsda(X,Y,ncomp=5)
  AnswerTests: omnitest(correctExpr='plsda(X,Y,ncomp=5)')
  Hint: Type plsda(X,Y,ncomp=5) and hit Enter.

- Class: cmd_question
  Output: That's awesome. But did you notice that you saw no outputs? That's because we did not save our plsda model. This time run the same command but let's save the output to a variable called 'result'.
  CorrectAnswer: result <- plsda(X,Y,ncomp=5)
  AnswerTests: omnitest(correctExpr='result <- plsda(X,Y,ncomp=5)')
  Hint: Type result <- plsda(X,Y,ncomp=5) and hit Enter.

- Class: text
  Output: We discussed few minutes back that, for plsda we should normalise the data in some form. The most used method is by scaling and centring the data. The plsda function we are using deals with that automatically. If you use other packages, you should make sure data normalisation or scaling and centring is performed.

- Class: text
  Output: In R, output from any model once saved can be browsed in many ways. One of my favourite ways in RStudio is to use '$' operator that we are so familiar with.

- Class: cmd_question
  Output: For example, your plsda now stored as result has many components to it. Try typing 'result$' and let contextual menu show you a list of elements you can view. We are going to choose to view explained variance. These are saved under 'prop_expl_var' within your results. So try 'result$prop_expl_var'
  CorrectAnswer: result$prop_expl_var
  AnswerTests: omnitest(correctExpr='result$prop_expl_var')
  Hint: Type result$prop_expl_var and hit Enter.

- Class: mult_question
  Output: Look at the X block in the output. What proportion of the variance in X is explained by your first component?
  AnswerChoices: 6%; 7%; 26%; 15%
  CorrectAnswer: 26%
  AnswerTests: omnitest(correctVal='26%')
  Hint: Look at the first value listed under $X in the output of your previous command.

- Class: cmd_question
  Output: To make a scores plot to see our pls-da, we use function 'plotIndiv()'. Try plotIndiv(result, group=liver.toxicity$treatment[,4])
  CorrectAnswer: plotIndiv(result, group=liver.toxicity$treatment[,4])
  AnswerTests: omnitest(correctExpr='plotIndiv(result, group=liver.toxicity$treatment[,4])')
  Hint: Type plotIndiv(result, group=liver.toxicity$treatment[,4]) and hit Enter.

- Class: text
  Output: Using simple codes, you have just created a scores plot for your pls-da model! You can see there are four time groups, six, 18, 24 and 48 hours after dosing, in four different colours.

- Class: mult_question
  Output: What is the first step you do once you've loaded your data to R, if you want to perform PLS-DA?
  AnswerChoices: Use plsda() function; Define Y variable only; Define X variable only; Define X and Y variables
  CorrectAnswer: Define X and Y variables
  AnswerTests: omnitest(correctVal='Define X and Y variables')
  Hint: We use both X and Y variables to create PLS-DA model.

- Class: mult_question
  Output: Once you have defined X and Y from your data, what do you do next for PLS-DA?
  AnswerChoices: Use plsda() function; Use pls() function; Use pls-da() function; Use PLSDA() function
  CorrectAnswer: Use plsda() function
  AnswerTests: omnitest(correctVal='Use plsda() function')
  Hint: In R functions are case-SENSITIVE like all other elements. plsda() function will work but if you change case, it wont.

- Class: mult_question
  Output: Which package did we use to perform plsda analysis?
  AnswerChoices: plsda(); mixplsda(); mixOmics(); mixomics()
  CorrectAnswer: mixOmics()
  AnswerTests: omnitest(correctVal='mixOmics()')
  Hint: This is the package we needed to make sure is installed before you started this exercise. 

- Class: mult_question
  Output: Lastly, what is the function you use to create scores plots in mixOmics?
  AnswerChoices: plsda(); plotScores(); plotIndiv(); plot()
  CorrectAnswer: plotIndiv()
  AnswerTests: omnitest(correctVal='plotIndiv()')
  Hint: plotIndiv() is used to create plots of observations i.e scores plot in our case.

- Class: text
  Output: You have now reached the end of this exercise. Before you finish, please take a few minutes to reflect on what you have done. You will answer a few short questions, and your answers will then be sent to Drupad by email when you type the final command. Apart from your name, please do not include personal or sensitive information about yourself or anyone else in your comments.

