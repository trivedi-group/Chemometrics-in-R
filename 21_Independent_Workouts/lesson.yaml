- Class: text
  Output: Welcome to your last Swirl exercise of the unit! You've made great progress so far and this is the time for you to shine.

- Class: text
  Output: A note before you begin. When you finish this lesson and send your reflection, the commands from the lesson will be saved as an R script in your working folder, or in a local folder if yours is cloud-synced. You can run that script again later or use it as a starting point for your own analyses.

- Class: text
  Output: When you restart swirl, type your name exactly as you did before, including capital letters, so that you can carry on where you left off.

- Class: text
  Output: In this particular exercise, I will point out a few key functions that you might find handy. But otherwise, you have your free will on how you deal with the data.

- Class: text
  Output: There are different datasets that are available as .csv on Canvas. Download these to a folder from where you can import them to R.

- Class: text
  Output: One of the handy commands to import files is 'read.csv(file.choose())', it will bring up a pop-up for you to choose your file. 

- Class: text
  Output: The other way to import the files in RStudio is by using the import button.

- Class: text
  Output: You could view the data once you import it using View() command. 

- Class: text
  Output: Once you have the data imported here, you can build your own logical workflow of analysing the data. There is no specific task - you visualise the data, perform clustering, dimension reduction, validation and tell me what you think of it. 

- Class: text
  Output: You should ideally perform data visualisation routines to see if there are any patterns within these data. You could also perform univariate and multivariate analysis.

- Class: text
  Output: In addition to the routine, PCA, MDS, PLS-DA, SVM, you could also try out your expertise at other methods.

- Class: text
  Output: If you feel confident, you should also perform KNN. 

- Class: text
  Output: Before you start your own analysis, here is a worked example of a typical workflow, from importing data to testing and visualising it. It uses synthetic data, which means made-up numbers generated for this exercise by a random number generator. They are not from a real study. Follow the steps, then repeat the same pattern on the real datasets.

- Class: text
  Output: The data are in a data frame called synth_data. It has four groups, G1 to G4, with 20 samples each, and ten measured variables, var01 to var10. In your own work you would import a file with read.csv(file.choose()), as described earlier.

- Class: cmd_question
  Output: The first step is to look at the data. Use head() to see the first six rows of synth_data.
  CorrectAnswer: head(synth_data)
  AnswerTests: omnitest(correctExpr='head(synth_data)')
  Hint: Type head(synth_data) and press Enter.

- Class: cmd_question
  Output: Now use str() to check the structure of the data and the type of each column.
  CorrectAnswer: str(synth_data)
  AnswerTests: omnitest(correctExpr='str(synth_data)')
  Hint: Type str(synth_data) and press Enter.

- Class: cmd_question
  Output: Check how many samples are in each group with table(synth_data$group).
  CorrectAnswer: table(synth_data$group)
  AnswerTests: omnitest(correctExpr='table(synth_data$group)')
  Hint: Type table(synth_data$group) and press Enter.

- Class: cmd_question
  Output: Check for missing values with anyNA(synth_data). The answer FALSE means that there are none.
  CorrectAnswer: anyNA(synth_data)
  AnswerTests: omnitest(correctExpr='anyNA(synth_data)')
  Hint: Type anyNA(synth_data) and press Enter.

- Class: text
  Output: Next, visualise the data before you test anything. A boxplot is a quick way to compare groups.

- Class: cmd_question
  Output: Draw a boxplot of var01 for each group with boxplot(var01 ~ group, data = synth_data).
  CorrectAnswer: boxplot(var01 ~ group, data = synth_data)
  AnswerTests: omnitest(correctExpr='boxplot(var01 ~ group, data = synth_data)')
  Hint: Type boxplot(var01 ~ group, data = synth_data) and press Enter.

- Class: text
  Output: In these synthetic data, var01 was made higher in G3 and G4 than in G1 and G2, so you should see two lower boxes and two higher boxes.

- Class: text
  Output: Next, explore all ten variables together with principal component analysis, which you met earlier in the unit. The variables are scaled first so that no variable dominates because of its units.

- Class: cmd_question
  Output: Run the analysis with pca <- prcomp(synth_data[, -1], scale. = TRUE). The -1 drops the first column, which holds the group labels.
  CorrectAnswer: pca <- prcomp(synth_data[, -1], scale. = TRUE)
  AnswerTests: expr_creates_var("pca"); omnitest(correctExpr='pca <- prcomp(synth_data[, -1], scale. = TRUE)')
  Hint: Type pca <- prcomp(synth_data[, -1], scale. = TRUE) and press Enter.

- Class: cmd_question
  Output: Look at how much variance each component explains with summary(pca).
  CorrectAnswer: summary(pca)
  AnswerTests: omnitest(correctExpr='summary(pca)')
  Hint: Type summary(pca) and press Enter.

- Class: mult_question
  Output: How many principal components did prcomp() return?
  AnswerChoices: 2; 4; 10; 80
  CorrectAnswer: '10'
  AnswerTests: omnitest(correctVal='10')
  Hint: Count the columns in the table of results from summary(pca).

- Class: cmd_question
  Output: Plot the first two components, coloured by group, with plot(pca$x[, 1], pca$x[, 2], col = as.factor(synth_data$group), pch = 19, xlab = "PC1", ylab = "PC2").
  CorrectAnswer: plot(pca$x[, 1], pca$x[, 2], col = as.factor(synth_data$group), pch = 19, xlab = "PC1", ylab = "PC2")
  AnswerTests: omnitest(correctExpr='plot(pca$x[, 1], pca$x[, 2], col = as.factor(synth_data$group), pch = 19, xlab = "PC1", ylab = "PC2")')
  Hint: Type plot(pca$x[, 1], pca$x[, 2], col = as.factor(synth_data$group), pch = 19, xlab = "PC1", ylab = "PC2") and press Enter.

- Class: cmd_question
  Output: Add a legend with legend("topright", legend = levels(as.factor(synth_data$group)), col = 1:4, pch = 19).
  CorrectAnswer: legend("topright", legend = levels(as.factor(synth_data$group)), col = 1:4, pch = 19)
  AnswerTests: omnitest(correctExpr='legend("topright", legend = levels(as.factor(synth_data$group)), col = 1:4, pch = 19)')
  Hint: Type legend("topright", legend = levels(as.factor(synth_data$group)), col = 1:4, pch = 19) and press Enter.

- Class: text
  Output: The groups overlap, because the group differences sit in only a few of the variables and the rest are random noise. A plot like this is a prompt for further tests, not a conclusion.

- Class: text
  Output: Now test the difference formally. A one-way analysis of variance (ANOVA) asks whether the group means of one variable differ by more than chance would explain.

- Class: cmd_question
  Output: Fit the model with fit <- aov(var01 ~ group, data = synth_data).
  CorrectAnswer: fit <- aov(var01 ~ group, data = synth_data)
  AnswerTests: expr_creates_var("fit"); omnitest(correctExpr='fit <- aov(var01 ~ group, data = synth_data)')
  Hint: Type fit <- aov(var01 ~ group, data = synth_data) and press Enter.

- Class: cmd_question
  Output: Look at the ANOVA table with summary(fit).
  CorrectAnswer: summary(fit)
  AnswerTests: omnitest(correctExpr='summary(fit)')
  Hint: Type summary(fit) and press Enter.

- Class: mult_question
  Output: Is the difference in var01 between the four groups significant at the 5% level?
  AnswerChoices: Yes; No
  CorrectAnswer: 'Yes'
  AnswerTests: omnitest(correctVal='Yes')
  Hint: Look at the Pr(>F) column. A value below 0.05 is significant at the 5% level.

- Class: text
  Output: ANOVA tells you that at least one group differs, but not which one. A post hoc test compares every pair of groups and adjusts the p values for the number of comparisons.

- Class: cmd_question
  Output: Run the post hoc test with TukeyHSD(fit).
  CorrectAnswer: TukeyHSD(fit)
  AnswerTests: omnitest(correctExpr='TukeyHSD(fit)')
  Hint: Type TukeyHSD(fit) and press Enter.

- Class: mult_question
  Output: Which comparison gave the largest adjusted p value?
  AnswerChoices: G2-G1; G3-G1; G4-G2; G4-G3
  CorrectAnswer: G4-G3
  AnswerTests: omnitest(correctVal='G4-G3')
  Hint: Look at the p adj column.

- Class: text
  Output: Finally, check how well the variables can predict the group by using cross-validation, which you met in the validation exercise. Cross-validation tests a model on data that it was not trained on.

- Class: cmd_question
  Output: Load the package with library(e1071).
  CorrectAnswer: library(e1071)
  AnswerTests: omnitest(correctExpr='library(e1071)')
  Hint: Type library(e1071) and press Enter.

- Class: cmd_question
  Output: Set the random seed with set.seed(1) so that everyone gets the same random folds.
  CorrectAnswer: set.seed(1)
  AnswerTests: omnitest(correctExpr='set.seed(1)')
  Hint: Type set.seed(1) and press Enter.

- Class: cmd_question
  Output: Fit a linear support vector machine with five-fold cross-validation using svm_cv <- svm(as.factor(group) ~ ., data = synth_data, kernel = "linear", cross = 5).
  CorrectAnswer: svm_cv <- svm(as.factor(group) ~ ., data = synth_data, kernel = "linear", cross = 5)
  AnswerTests: expr_creates_var("svm_cv"); omnitest(correctExpr='svm_cv <- svm(as.factor(group) ~ ., data = synth_data, kernel = "linear", cross = 5)')
  Hint: Type svm_cv <- svm(as.factor(group) ~ ., data = synth_data, kernel = "linear", cross = 5) and press Enter.

- Class: cmd_question
  Output: Look at the result with summary(svm_cv).
  CorrectAnswer: summary(svm_cv)
  AnswerTests: omnitest(correctExpr='summary(svm_cv)')
  Hint: Type summary(svm_cv) and press Enter.

- Class: text
  Output: Look at Total Accuracy in the output. With four equal groups, guessing would give about 25%. The accuracy is above that but far from perfect, because most of the variables are noise. This is an honest result, and a real report should say so.

- Class: text
  Output: That is the whole pattern. Import the data, check it, visualise it, explore it, test it, validate it, then report what you found, including results that are modest. With many variables you should also think about multiple testing. When you finish this lesson, the commands you typed will be saved as a script, which you can use as a template for the real datasets.

- Class: text
  Output: Before I finish this exercise, I will describe the three datasets you have on Canvas to give you an idea of what you should be looking for in the data. 

- Class: text
  Output: Dataset 1 is an output from cell media study. The researcher has measured different essential molecules produced by a set of stem cells. The four types of media are E6, E6R, E8 and E8R. A total of 140 observations were recorded using mass spectrometry. A total of 58 small molecules were quantified by this researcher. Now the data is made available to you. What can you tell the researcher about these media types? What does mass spectrometry tell us about the metabolites produced by stem cells?

- Class: text
  Output: Dataset 2 is an output from mice study. The mice had a gene knocked out from their genome. The researcher wants to know how are different chemicals that regulate the normal biology of a wild type mice different from a knock out mice. The research further treated half the mice with a drug to compensate for this knock out effect. He did same drug treatment to the wild types too. This makes up four groups - knock out, knock out treated, wild type, wild type treated. The researcher also include a pooled quality control in his data. This quality control is an average reflection of all the samples included in this study. In total, including QCs, 45 observations are present in the data and there are 66 variables. What can you tell the us about these mice and data produced by their body under different conditions?

- Class: text
  Output: Dataset 3 is made up of various fats. The researcher wants to know if they use analytical techniques and see what each fat samples consists of, can she find similarities in them? She has used solid oil, liquid oil, three types of fatty acids called fas1, fas2, fas3 and three types of lipids called lb1, lb2 and lb3. In total 8 samples and she ended up with 2683 variables. Can you tell her, the story that her data have to tell?

- Class: text
  Output: Let's not waste too much of your time. You are free to take as long or as little as you need to take to complete this task. Attempt all datasets and see what you find. 

- Class: text
  Output: Please use the Canvas discussion boards to share ideas, scripts, codes etc with your peers and learn together. Good luck!

- Class: text
  Output: You have now reached the end of this exercise. Before you finish, please take a few minutes to reflect on what you have done. You will answer a few short questions, and your answers will then be sent to Drupad by email when you type the final command. Apart from your name, please do not include personal or sensitive information about yourself or anyone else in your comments.

