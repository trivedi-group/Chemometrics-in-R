- Class: text
  Output: Welcome to week 5! In the last 4 weeks, we have looked at a few statistical tests. Data analysis you perform using those tests is called univariate analysis. 

- Class: text
  Output: A good chemometrician will always visualise their data first before starting with statistical analysis. Why? Because it gives a good summary of your data. 


- Class: text
  Output: We learnt in the previous week that knowing your data structure is very important. From this week on, we will use R more often to get hands on experience with exploring data structure and also for data analysis.

- Class: text
  Output: Now that you are comfortable with using R and Swirl, let us learn a few basic commands. I have included a mass spectrometry data for you in this lesson.


- Class: cmd_question
  Output: Let us try to view this data. Type 'View(data)' followed by Enter and see what happens.
  CorrectAnswer: View(data)
  AnswerTests: omnitest(correctExpr='View(data)')
  Hint: Type View(data) and hit Enter.
  
- Class: text
  Output: The data contains 5897 continous variables and 1 group variable. First column is sample names as index.

- Class: mult_question
  Output: The group column is..
  AnswerChoices: Quantitative variable; A ordinal variable; A continous variable; A nominal variable
  CorrectAnswer: A nominal variable
  AnswerTests: omnitest(correctVal='A nominal variable')
  Hint: The group column has labels such as QC, Case and Control. 
  
- Class: text
  Output: This data has LOTS of variables measured in serum samples. These measurements will have many underlying variations and not all of these can be accounted for using univarite statistics.

- Class: cmd_question
  Output: You can view single variable in a big dataset using '$'. For example to view first continous variable M304T13, you can use command 'View(data$M304T13)'. Try typing this now. 
  CorrectAnswer: View(data$M304T13)
  AnswerTests: omnitest(correctExpr='View(data$M304T13)')
  Hint: Type View(data$M304T13) and hit Enter.
  
- Class: text
  Output: Dot plots are simplest graphs to view any variable. Mostly the data is plotted across x-axis. Hit Enter to view dot plot for this variable MT304T13

- Class: figure
  Output: You are now viewing our variable as a dot plot. 
  Figure: dotplot.R
  FigureType: new
  
- Class: text
  Output: We can see from this dot plot that most of our samples have no intensity at all for this variable. They are zero. This could mean that this particular analyte is absent in serum.

- Class: text
  Output: Dot plots are very effective in displaying individual variables by samples. They are useful in small dataset. But can you imagine doing this plot for each variable, when you have thousands of variables?

- Class: text
  Output: You have come across histograms earlier. These are sort of dot plots, but instead of individual numerical value, we visualise 'data bins' where data is partitioned to represent our data in a condensed form. Hit Enter to view M304T13 as a histogram.

- Class: figure
  Output: M304T13 histogram is now displayed as a figure. 
  Figure: histogram.R
  FigureType: new
  
- Class: text
  Output: Similar to our dot plot, even as a histogram, we can see majority of our samples have intensity of zero for this variable. But you can also see some samples have really high intensity (to the extremem right of histogram).

- Class: text
  Output: Histograms are great to visualise the shape of distribution of our data. Data can be left or right skewed. As you can see our data is left skewed. Meaning most of our data points leans towards the left. Hit Enter to view an example of right skewed data.

- Class: figure
  Output: Here the distribution is skewed to the right. 
  Figure: mod1_rightskew.R
  FigureType: new
  
- Class: text
  Output: Similarly, some datasets can be left skewed where the left tail of the plot is longer. We decide skewness by looking at the tail. Hit Enter to see what I mean by left skewed data.

- Class: figure
  Output: Now this is a left skewed data example. Note that the blue line in both cases is MEAN and black line is MEDIAN.
  Figure: mod1_leftskew.R
  FigureType: new
  
- Class: text
  Output: 'Let us go back to our histogram.'

- Class: figure
  Output: M304T13 histogram is now displayed as a figure. 
  Figure: histogram.R
  FigureType: new
  
- Class: mult_question
  Output: What can you tell about the skewness of this variable?
  AnswerChoices: Left skewed; Symmetrical; Right skewed
  CorrectAnswer: Right skewed
  AnswerTests: omnitest(correctVal='Right skewed')
  Hint: The tail of our histogram is longer on the right. 

- Class: video
  Output: A special type of histogram is known as Stem and Leaf plot. The numerical data is organised in order of decimal place values. The number of leaves is equal to the number of variables in the dataset. Have a look at Stem and Leaf plot on YouTube.
  VideoLink: http://youtu.be/OaJXJduRiIE
  
- Class: text
  Output: As you would remember, means are one of the important measures to compare your experimental results to reference or even two or more groups within your data.

- Class: cmd_question
  Output: You could find out means of all the variables in your dataset using a simple command. Try 'colMeans()' function. The way functions work in R, you write your values within brackets. For colMeans function, the value within bracket is the name of your data matrix. Here our data matrix is called 'data'.
  CorrectAnswer: colMeans('data')
  AnswerTests: omnitest(correctExpr='colMeans('data')')
  Hint: Type a hint.
